<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Inkstrip — offline</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0e0e10; color: #f3efe6; font: 16px/1.5 system-ui, sans-serif; }
      main { min-height: 100%; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { color: #b9b3a7; max-width: 32ch; margin: 0 auto 24px; }
      button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 8px; background: #f3efe6; color: #0e0e10; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div>
        <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#1b1b1f"/><rect x="11" y="4" width="10" height="24" rx="1.5" fill="#f3efe6"/><rect x="13" y="7" width="6" height="3" fill="#161513"/><rect x="13" y="11.5" width="6" height="5" fill="#161513"/><rect x="13" y="18" width="6" height="6" fill="#161513"/></svg>
        <h1>Inkstrip can't connect</h1>
        <p>Check your internet connection and try again. Your projects stay saved on this device.</p>
        <button type="button" onclick="location.replace('https://inkstrip-manhwa-studio.vercel.app/')">Try again</button>
      </div>
    </main>
  </body>
</html>
