<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inkstrip Manhwa Studio</title>
    <link rel="stylesheet" href="./titlebar.css" />
    <script type="module" src="./titlebar.js"></script>
  </head>
  <body data-design="studio">
    <header class="bar" role="banner">
      <div class="left">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" />
            <path d="m6.08 9.5-3.5 1.6a1 1 0 0 0 0 1.81l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9a1 1 0 0 0 0-1.83l-3.5-1.59" />
            <path d="m6.08 14.5-3.5 1.6a1 1 0 0 0 0 1.81l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9a1 1 0 0 0 0-1.83l-3.5-1.59" />
          </svg>
        </span>
        <span class="brand">Inkstrip</span>
        <button class="menu-all" type="button" data-menu="all" aria-label="Application menu" title="Menu (Alt)">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" /></svg>
        </button>
        <nav class="menus" aria-label="Application menu">
          <button type="button" data-menu="file"><u>F</u>ile</button>
          <button type="button" data-menu="edit"><u>E</u>dit</button>
          <button type="button" data-menu="view"><u>V</u>iew</button>
          <button type="button" data-menu="help"><u>H</u>elp</button>
        </nav>
      </div>
      <div class="center">
        <nav class="crumbs" aria-label="Location"></nav>
        <span class="title"></span>
        <button class="command-center" type="button" title="Command Palette (Ctrl+Shift+P)">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5" /><path d="m10.5 10.5 3 3" /></svg>
          <span class="command-text">Inkstrip</span>
          <kbd>Ctrl+Shift+P</kbd>
        </button>
      </div>
      <div class="right">
        <div class="save" role="status" aria-live="polite">
          <span class="dot" aria-hidden="true"></span>
          <span class="save-text"></span>
          <button class="save-button" type="button" title="Save (Ctrl+S)">Save</button>
        </div>
      </div>
    </header>
  </body>
</html>
