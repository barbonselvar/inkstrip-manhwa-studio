<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inkstrip</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0e0e10; color: #f3efe6; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
      main { min-height: 100%; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
      h1 { font-size: 20px; margin: 16px 0 6px; font-weight: 600; }
      p { color: #b9b3a7; max-width: 36ch; margin: 0 auto 20px; }
      button { min-height: 40px; padding: 0 22px; border: 0; border-radius: 6px; background: #f3efe6; color: #0e0e10; font: inherit; font-weight: 600; cursor: pointer; }
      .spin { width: 22px; height: 22px; margin: 18px auto 0; border: 2px solid #3a3833; border-top-color: #f3efe6; border-radius: 50%; animation: s 0.8s linear infinite; }
      @keyframes s { to { transform: rotate(360deg); } }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div>
        <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#1b1b1f"/><rect x="11" y="4" width="10" height="24" rx="1.5" fill="#f3efe6"/><rect x="13" y="7" width="6" height="3" fill="#161513"/><rect x="13" y="11.5" width="6" height="5" fill="#161513"/><rect x="13" y="18" width="6" height="6" fill="#161513"/></svg>
        <div id="loading"><h1>Opening Inkstrip…</h1><div class="spin" role="progressbar" aria-label="Loading"></div></div>
        <div id="offline" hidden>
          <h1>Inkstrip can't connect</h1>
          <p>Check your internet connection and try again. Your projects stay saved on this computer.</p>
          <button type="button" id="retry">Try again</button>
        </div>
      </div>
    </main>
    <script>
      const APP_URL = "https://inkstrip-manhwa-studio.vercel.app/";
      const loading = document.getElementById("loading");
      const offline = document.getElementById("offline");
      async function open() {
        loading.hidden = false;
        offline.hidden = true;
        const timeout = new AbortController();
        const timer = setTimeout(() => timeout.abort(), 15000);
        try {
          await fetch(APP_URL, { mode: "no-cors", cache: "no-store", signal: timeout.signal });
          location.replace(APP_URL);
        } catch {
          loading.hidden = true;
          offline.hidden = false;
        } finally {
          clearTimeout(timer);
        }
      }
      document.getElementById("retry").addEventListener("click", open);
      open();
    </script>
  </body>
</html>
