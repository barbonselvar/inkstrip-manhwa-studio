[package]
name = "inkstrip-desktop"
version = "1.0.0"
description = "Inkstrip Manhwa Studio for Windows"
authors = ["Inkstrip"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "inkstrip_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
