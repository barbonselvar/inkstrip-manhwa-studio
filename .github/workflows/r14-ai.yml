name: R14 real AI editing checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r14-ai-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Prepare evidence directories
        run: sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /workspace/r14-evidence /workspace/screenshots
      - name: Start source QA server
        run: |
          VITE_AUTH_ENABLED=false npm run dev -- --config scripts/vite-browser-qa.config.mjs > /workspace/r14-evidence/dev.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /workspace/r14-evidence/dev.log
          exit 1
      - name: Real pinned Fast Anime, transactions and five viewport widths
        run: npm run test:r14:browser
      - name: Native retouch ownership and reference persistence
        run: |
          npm run test:r14:tiles
          npm run test:r14:retouch
          npm run test:r14:characters
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r14-real-inference
          path: |
            /workspace/r14-evidence
            /workspace/screenshots/r14-*.png
          if-no-files-found: warn
  inference-parity:
    # Real Swin2SR and Fast Anime inference (1x/2x/4x, alpha, cache integrity,
    # cancellation, budgets) with raw Swin2SR parity against the PR's base branch.
    name: R14 real inference x2/x4 and base parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Baseline worktree of the base commit
        run: |
          git worktree add "$RUNNER_TEMP/baseline" "${{ github.event.pull_request.base.sha || 'origin/main' }}"
          (cd "$RUNNER_TEMP/baseline" && npm ci --no-audit --no-fund)
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Prepare evidence directory
        run: sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /workspace/r14-evidence
      - name: Start R14 (:8080) and baseline (:8083) source servers
        run: |
          VITE_AUTH_ENABLED=false npm run dev -- --config scripts/vite-browser-qa.config.mjs > "$RUNNER_TEMP/r14-dev.log" 2>&1 &
          (cd "$RUNNER_TEMP/baseline" && VITE_AUTH_ENABLED=false PATH="$PWD/node_modules/.bin:$PATH" \
            node scripts/with-app-env.mjs vite dev --host 127.0.0.1 --port 8083 --strictPort \
            --config scripts/vite-browser-qa.config.mjs > "$RUNNER_TEMP/base-dev.log" 2>&1 &)
          for port in 8080 8083; do
            for attempt in $(seq 1 90); do
              if curl -fsS "http://127.0.0.1:$port/" > /dev/null; then break; fi
              if [ "$attempt" = 90 ]; then cat "$RUNNER_TEMP/r14-dev.log" "$RUNNER_TEMP/base-dev.log"; exit 1; fi
              sleep 1
            done
          done
      - run: npm run test:r14:inference -- http://127.0.0.1:8080 http://127.0.0.1:8083
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r14-inference-parity
          path: |
            /workspace/r14-evidence/inference-check.json
            ${{ runner.temp }}/r14-dev.log
            ${{ runner.temp }}/base-dev.log
          if-no-files-found: warn
